# Use 256-color mode for enhanced color fidelity
set-option -sa terminal-features ',xterm-256color:RGB'
set-option -g focus-events on

# First tmux windows to 1
set -g base-index 1

# Basic configuration
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Split panes using | and -
unbind %
bind | split-window -h
unbind '"'
bind - split-window -v

# Reload tmux configuration with prefix + r
unbind r
bind r source-file ~/.tmux.conf

# Resize panes with arrow keys, holding the prefix
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r h resize-pane -L 5
bind -r l resize-pane -R 5

# Toggle pane zoom with 'm'
bind -r m resize-pane -Z

# Enable mouse support
set -g mouse on

# Use Vi mode for copy mode and status line input
setw -g mode-keys vi
set -g status-keys vi

# Clipboard Integration for copying to system clipboard
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# Reduce delay for exiting insert mode in Vim/Neovim
set -sg escape-time 10

# TPM (Tmux Plugin Manager) configuration
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'jimeh/tmux-themepack'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Move status bar to the top
set -g status-position top

# Streamlined status bar design
set -g status-interval 1
set -g status-justify centre
set -g status-style fg=brightwhite,bg=default,none

# Minimal left status: Session name
set -g status-left "#[fg=brightcyan,bg=default]#S "
set -g status-right "#[fg=brightgreen]%H:%M"

set -g status-right-length 100
# Active window title: Highlight with a contrasting color
setw -g window-status-current-style fg=black,bg=brightcyan

# Inactive window title: Keep it simple and less highlighted
setw -g window-status-style fg=brightwhite,bg=default

# Pane border styling: Active border in a contrasting color
setw -g pane-border-style fg=grey
setw -g pane-active-border-style fg=brightcyan

# Enable synchronization across all panes in a window with prefix + C-s
bind C-s setw synchronize-panes

# Load TPM
if-shell 'test -f ~/.tmux/plugins/tpm/tpm' 'run-shell ~/.tmux/plugins/tpm/tpm'
