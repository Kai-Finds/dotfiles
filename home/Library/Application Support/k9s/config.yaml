k9s:
  # Triage-first setup for daily DevSecOps work on multi-cluster.
  liveViewAutoRefresh: false
  refreshRate: 2
  maxConnRetry: 5
  readOnly: false
  noExitOnCtrlC: false
  skipLatestRevCheck: true
  disablePodCounting: false
  defaultView: pods
  # Never expose a port-forward on all interfaces.
  portForwardAddress: 127.0.0.1
  ui:
    enableMouse: true
    headless: false
    logoless: false
    crumbsless: false
    splashless: false
    reactive: true
    noIcons: false
    defaultsToFullScreen: false
    skin: TokyoNight
  # netshoot gives you curl/dig/nslookup/tcpdump/ss without touching the workload.
  shellPod:
    image: nicolaka/netshoot:latest
    namespace: default
    limits:
      cpu: 200m
      memory: 256Mi
  imageScans:
    enable: false
    exclusions:
      namespaces: []
      labels: {}
  logger:
    tail: 200
    buffer: 10000
    sinceSeconds: 3600
    textWrap: false
    showTime: true
  thresholds:
    cpu:
      critical: 90
      warn: 70
    memory:
      critical: 90
      warn: 70
