# ~/.config/starship.toml

# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = true

# Change command timeout from 500 to 5000 ms
command_timeout = 5000
format = """$env_var $all"""
right_format = """$time"""

# Catppuccin Macchiato palette — matches the user's terminal theme AND the
# Claude Code statusline. Variant matters: Macchiato fg on Macchiato bg
# (#24273a) gives the contrast level the Catppuccin designers calibrated.
# Standard ANSI color names (green/red/blue/...) get overridden by these hex
# values, so every "bold green" downstream renders as Catppuccin green.
palette = "catppuccin_macchiato"

[palettes.catppuccin_macchiato]
rosewater = "#f4dbd6"
flamingo  = "#f0c6c6"
pink      = "#f5bde6"
mauve     = "#c6a0f6"
red       = "#ed8796"
maroon    = "#ee99a0"
peach     = "#f5a97f"
yellow    = "#eed49f"
green     = "#a6da95"
teal      = "#8bd5ca"
sky       = "#91d7e3"
sapphire  = "#7dc4e4"
blue      = "#8aadf4"
lavender  = "#b7bdf8"
text      = "#cad3f5"
subtext1  = "#b8c0e0"
subtext0  = "#a5adcb"
overlay2  = "#939ab7"
overlay1  = "#8087a2"
overlay0  = "#6e738d"
surface2  = "#5b6078"
surface1  = "#494d64"
surface0  = "#363a4f"
base      = "#24273a"
mantle    = "#1e2030"
crust     = "#181926"
# ANSI aliases — let modules that default to "cyan" / "purple" / "magenta"
# resolve to Catppuccin teal / mauve instead of terminal-native cyan/magenta.
cyan      = "#8bd5ca"
purple    = "#c6a0f6"
magenta   = "#c6a0f6"

# Change the default prompt characters
[character]
# old config
success_symbol = "[ ](bold green)"
error_symbol = "[ ](bold red)"

# Shows the username only for the root user
[username]
style_root = "bold red"
format = "[💣 $user ]($style)"
disabled = false
show_always = false

[hostname]
ssh_only = false
format = "on [ $hostname](bold yellow) "
disabled = true

[localip]
ssh_only = true
format = " [$localipv4](bold blue) "
disabled = false

[directory]
truncation_length = 1
truncation_symbol = "…/"
truncate_to_repo = true
home_symbol = " ~"
read_only_style = "red"
read_only = "  "
style = "bold mauve"
format = "[$path]($style)[$read_only]($read_only_style) "

[memory_usage]
disabled = true
threshold = -1
symbol = ' '
style = 'bold dimmed red'
format = "use [󰇭 $ram]( $symbol$style) "

[custom.git_repo_name]
command = "basename $(git rev-parse --show-toplevel) 2>/dev/null || echo ''"
when = "git rev-parse --is-inside-work-tree 2>/dev/null"
format = "in [$output]($style) "
style = "bold green"
disabled = true

[git_branch]
symbol = " "
format = "on [$symbol$branch]($style) "
truncation_symbol = "…/"
style = "bold blue"

[git_status]
format = '[\($all_status$ahead_behind\)]($style) '
style = "bold peach"
conflicted = ""
up_to_date = " "
untracked = " "
ahead = "⇡${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
behind = "⇣${count}"
stashed = "󰆧 "
modified = " "
staged = '[++\($count\)](green)'
renamed = " "
deleted = " "

[git_commit]
format = "[$hash](bold teal) "
disabled = false
style = "bold teal"
commit_hash_length = 7
only_detached = true

[kubernetes]
format = 'via [󱃾 $context\($namespace\)](bold blue) '
disabled = true
#detect_files = ['k8s']

[terraform]
format = "via [󱁢 terraform $version]($style)  [$workspace]($style) "
disabled = false
detect_files = [
  "*.tf",
  "*.hcl",
  "*.tfstate",
  "*.tfstate.backup",
  "*.tfvars",
  "terraform.rc",
  ".terraformrc",
  "terragrunt.hcl",
]

[vagrant]
format = "via [ vagrant $version](bold blue) "
disabled = false
detect_files = ["Vagrantfile"]

[docker_context]
format = "via [󰡨 $context](bold blue) "
disabled = false
detect_files = [
  "Dockerfile",
  "Dockerfile.*",
  "docker-compose.yml",
  "docker-compose.yaml",
  "docker-compose.*.yml",
  "docker-compose.*.yaml",
  "compose.yml",
  "compose.yaml",
  ".dockerignore",
]

[helm]
format = "via [󰠳 $version](bold purple) "
disabled = false
detect_files = ["helmfile.yaml", "*.helm", "*.chart"]

[python]
symbol = " "
python_binary = "python3"
disabled = false
detect_files = [
  "*.py",
  "*.pyx",
  "*.pyi",
  "Pipfile",
  "requirements.txt",
  "requirements-dev.txt",
  "setup.py",
  "setup.cfg",
  "pyproject.toml",
  "poetry.lock",
  "conda.yaml",
  "environment.yml",
  "tox.ini",
  "pytest.ini",
  "__init__.py",
]

[nodejs]
format = "via [󰎙 $version](bold green) "
disabled = false
detect_files = ["package.json", "node_modules"]

[ruby]
format = "via [ $version]($style) "
disabled = false
detect_files = ["Gemfile", "*.rb"]

[golang]
format = "via [󰊯 $version]($style) "
disabled = false
detect_files = ["go.mod", "*.go"]

[lua]
format = "via [ $version]($style) "
disabled = false
detect_files = ["*.lua"]

[rust]
format = "via [󱘗 $version]($style) "
disabled = false
detect_files = ["Cargo.toml", "Cargo.lock", "*.rs"]

[java]
format = "via [󰬷 $version]($style) "
disabled = false
detect_files = ["pom.xml", "build.gradle", "build.gradle.kts", "*.java", "*.kt", "*.kts"]

[php]
format = "via [󰌟 $version]($style) "
disabled = false
detect_files = ["composer.json", "*.php", "*.phar"]

[c]
format = "via [ $version]($style) "
disabled = false
detect_files = ["*.c", "*.h", "CMakeLists.txt", "Makefile", "configure.ac"]

[conda]
format = "via [ $environment]($style) "
disabled = false
ignore_base = true


[time]
disabled = true
format = '[$time]($style) '
style = 'bold dimmed white'
time_format = "%H:%M"
utc_time_offset = "local"
