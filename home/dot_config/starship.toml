# ~/.config/starship.toml

# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = true

# Change command timeout from 500 to 5000 ms
command_timeout = 5000
format = """$env_var $all"""
right_format = """$time"""

# Catppuccin Mocha matches the shared terminal palette.
palette = "catppuccin_mocha"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

# ANSI aliases used by language modules.
cyan = "#94e2d5"
purple = "#cba6f7"
magenta = "#cba6f7"

# Change the default prompt characters
[character]
# old config
success_symbol = "[ ](bold green)"
error_symbol = "[ ](bold red)"

# Shows the username only for the root user
[username]
style_root = "bold red"
format = "[💣 $user ]($style)"
disabled = false
show_always = false

[hostname]
ssh_only = false
format = "on [ $hostname](bold yellow) "
disabled = true

[localip]
ssh_only = true
format = " [$localipv4](bold blue) "
disabled = false

[directory]
truncation_length = 1
truncation_symbol = "…/"
truncate_to_repo = true
home_symbol = " ~"
read_only_style = "red"
read_only = "  "
style = "bold mauve"
format = "[$path]($style)[$read_only]($read_only_style) "

[memory_usage]
disabled = true
threshold = -1
symbol = ' '
style = 'bold dimmed red'
format = "use [󰇭 $ram]( $symbol$style) "

[custom.git_repo_name]
command = "basename $(git rev-parse --show-toplevel) 2>/dev/null || echo ''"
when = "git rev-parse --is-inside-work-tree 2>/dev/null"
format = "in [$output]($style) "
style = "bold green"
disabled = true

[git_branch]
symbol = " "
format = "on [$symbol$branch]($style) "
truncation_symbol = "…/"
style = "bold blue"

[git_status]
format = '[\($all_status$ahead_behind\)]($style) '
style = "bold peach"
conflicted = ""
up_to_date = " "
untracked = " "
ahead = "⇡${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
behind = "⇣${count}"
stashed = "󰆧 "
modified = " "
staged = '[++\($count\)](green)'
renamed = " "
deleted = " "

[git_commit]
format = "[$hash](bold teal) "
disabled = false
style = "bold teal"
commit_hash_length = 7
only_detached = true

[kubernetes]
format = 'via [󱃾 $context\($namespace\)](bold blue) '
disabled = true
#detect_files = ['k8s']

[terraform]
format = "via [󱁢 terraform $version]($style)  [$workspace]($style) "
disabled = false
detect_files = [
  "*.tf",
  "*.hcl",
  "*.tfstate",
  "*.tfstate.backup",
  "*.tfvars",
  "terraform.rc",
  ".terraformrc",
  "terragrunt.hcl",
]

[vagrant]
format = "via [ vagrant $version](bold blue) "
disabled = false
detect_files = ["Vagrantfile"]

[docker_context]
format = "via [󰡨 $context](bold blue) "
disabled = false
detect_files = [
  "Dockerfile",
  "Dockerfile.*",
  "docker-compose.yml",
  "docker-compose.yaml",
  "docker-compose.*.yml",
  "docker-compose.*.yaml",
  "compose.yml",
  "compose.yaml",
  ".dockerignore",
]

[helm]
format = "via [󰠳 $version](bold purple) "
disabled = false
detect_files = ["helmfile.yaml", "*.helm", "*.chart"]

[python]
symbol = " "
python_binary = "python3"
disabled = false
detect_files = [
  "*.py",
  "*.pyx",
  "*.pyi",
  "Pipfile",
  "requirements.txt",
  "requirements-dev.txt",
  "setup.py",
  "setup.cfg",
  "pyproject.toml",
  "poetry.lock",
  "conda.yaml",
  "environment.yml",
  "tox.ini",
  "pytest.ini",
  "__init__.py",
]

[nodejs]
format = "via [󰎙 $version](bold green) "
disabled = false
detect_files = ["package.json", "node_modules"]

[ruby]
format = "via [ $version]($style) "
disabled = false
detect_files = ["Gemfile", "*.rb"]

[golang]
format = "via [󰊯 $version]($style) "
disabled = false
detect_files = ["go.mod", "*.go"]

[lua]
format = "via [ $version]($style) "
disabled = false
detect_files = ["*.lua"]

[rust]
format = "via [󱘗 $version]($style) "
disabled = false
detect_files = ["Cargo.toml", "Cargo.lock", "*.rs"]

[java]
format = "via [󰬷 $version]($style) "
disabled = false
detect_files = ["pom.xml", "build.gradle", "build.gradle.kts", "*.java", "*.kt", "*.kts"]

[php]
format = "via [󰌟 $version]($style) "
disabled = false
detect_files = ["composer.json", "*.php", "*.phar"]

[c]
format = "via [ $version]($style) "
disabled = false
detect_files = ["*.c", "*.h", "CMakeLists.txt", "Makefile", "configure.ac"]

[conda]
format = "via [ $environment]($style) "
disabled = false
ignore_base = true


[time]
disabled = true
format = '[$time]($style) '
style = 'bold dimmed white'
time_format = "%H:%M"
utc_time_offset = "local"
